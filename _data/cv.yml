# Projects
projects:
  - title: Football Wizards - Football Analytics Platform (live at api.gurutux.com)
    description: >
      Designed and operate a two-service FastAPI / SQLAlchemy / PostgreSQL platform - a public read-only API with a React explorer,
      and an isolated admin control plane for scheduled ingestion jobs with live progress streaming. Modelled a normalized
      schema (123 player and 32 team stat types, minute-stamped match events) holding 10M+ stat rows across ~9,600 matches,
      fed by a pluggable ingestion layer with 5 source adapters, content-hash caching and cross-source entity resolution.
      Enforced least privilege at the database layer with separate Postgres roles, so the public service cannot read admin
      state or secrets. Built a validation framework that caught a column-mapping defect and corrected 5,307 records.
      Shipped with Docker Compose, auto-applied Alembic migrations and one-command deploys with health checks,
      self-hosted on Proxmox. Developed AI-first with Claude Code under a persisted architecture and decision log.

  - title: Automated Azan - Prayer Announcements for Chromecast (github.com/shenhab/Automated-Azan)
    description: >
      Open-source Python service that schedules and streams prayer announcements to Chromecast and Google Home devices,
      with a web management interface. Packaged as a multi-stage Docker image (non-root user, health check) published
      to Docker Hub, with a GitHub Actions release pipeline that builds and pushes versioned and latest tags on each
      release and a Docker Compose deployment.

  - title: YamlCV
    description: >
      This CV. A Jekyll-based CV-as-code system that uses YAML as the single source of truth and generates both an
      interactive HTML resume and an ATS-friendly version from it. https://github.com/shenhab/YamlCV

  - title: Home Lab - Self-Hosted Infrastructure
    description: >
      Run a self-hosted environment on a two-node Proxmox VE cluster that lets workloads be managed and migrated between
      nodes, with a TrueNAS server providing shared storage and continuous off-site backup of its data to cloud storage.
      It hosts my own services, including Football Wizards and an n8n instance for workflow automation.

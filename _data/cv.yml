    achievements:
      - Designed and led Heimdall, Okta's continuous compliance-evidence platform, as tech lead and primary author - ~90% of 570+ commits, ~33k lines of production Python and 2,100+ automated tests.
      - Automated a SOC 2 audit cycle end to end - 127 evidence tickets collected, attached and submitted with no manual work, 125 accepted by auditors (98%) and the other 2 routed to service owners for remediation, replacing ~635 engineering hours of manual collection (~5 hours per ticket) with 8 hours of automated runtime.
      - Architected a plugin-based core (orchestration, credential management, per-call API audit trail, multi-format reporting) that new data sources plug into without touching core logic, and scaled it to 23 collectors across Okta, GitHub, AWS and HTTP producing 129 evidence artifacts mapped to 171 security controls.
      - Closed the loop with the audit process - built a Windmill-based orchestrator that claims audit Jira tickets, runs the matching collection, attaches the evidence and transitions the ticket, with stale-job detection, Slack alerting with one-click retry and staggered monthly schedules per artifact.
      - Built an integrity-verified evidence delivery pipeline - 5 AWS Lambda functions orchestrated by Step Functions and defined in CloudFormation, verifying checksums at every hop from S3 to Google Drive.
      - Owned CI/CD and release architecture - GitHub Actions builds one version-locked artifact, verified at three independent points, auto-deployed to dev and promoted weekly to production via AWS CodeDeploy (65 tagged releases), with zero-touch host provisioning and self-bootstrapping credentials.
      - Delivered the Heimdall and Windmill platforms as infrastructure as code - AWS resources defined in CloudFormation, Windmill deployed as Docker containers, and everything rolled out to hosts with AWS CodeDeploy and driven end to end by GitHub Actions, so both environments are built from the repository rather than by hand.
      - Implemented secure-by-design API clients (OAuth2 private-key JWT with DPoP, GitHub App authentication, rate-limit-aware pagination) and closed security and reliability gaps - remediated Dependabot findings, hardened serialization paths and re-architected reporting to stream to disk, eliminating out-of-memory failures on large collection runs.
      - Built ActionHub, a compliance workflow platform (Flask / PostgreSQL) that replaced manual compliance questionnaires - dynamic forms, assignment lifecycle, reviewer RBAC, a background workflow engine, full audit logging and Okta SSO, backed by 980 tests.
      - Drove AI adoption across the team - authored Claude Code skills that make evidence tracing and ticket triage deterministic, built local MCP servers (generated with Claude Code) for internal APIs such as Jira so agents could operate those services directly, ran sessions on AI-assisted engineering, and designed a multi-agent system that generates new collectors from Jira requests to scale coverage across the remaining audit scope.

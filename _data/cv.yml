# Projects
projects:
  - title: Football Wizards - Football Analytics Platform (live at api.gurutux.com)
    description: >
      Designed and operate a two-service FastAPI / PostgreSQL platform - a public read-only API with a React explorer,
      and an isolated admin control plane for scheduled ingestion jobs with live progress streaming. Modelled a normalized
      schema (123 player and 32 team stat types, minute-stamped match events) holding 10M+ stat rows across ~9,600 matches,
      fed by a pluggable ingestion layer with 5 source adapters, content-hash caching and cross-source entity resolution.
      Enforced least privilege at the database layer with separate Postgres roles, so the public service cannot read admin
      state or secrets. Built a validation framework that caught a column-mapping defect and corrected 5,307 records.
      Shipped with Docker Compose, auto-applied Alembic migrations and one-command deploys with health checks,
      self-hosted on Proxmox. Developed AI-first with Claude Code under a persisted architecture and decision log.


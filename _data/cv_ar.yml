# الملخص المهني
summary: >
  مهندس أول (Staff Engineer) بخبرة 15 عامًا في هندسة المنصات وهندسة موثوقية المواقع (SRE) وأتمتة الأمن لدى AWS
  وServiceNow وOkta، مع جذور عميقة في تشغيل أنظمة Linux وقواعد البيانات العلائقية. في Okta، صممتُ وقدتُ Heimdall،
  منصة مستمرة لجمع أدلة الامتثال تغطي 171 ضابطًا أمنيًا عبر Okta وGitHub وAWS؛ وفي دورة تدقيق SOC 2 واحدة حلّت
  8 ساعات من الأتمتة محل نحو 635 ساعة هندسية من العمل اليدوي، مع قبول المدققين لـ 98% من الأدلة. قبل ذلك، عملتُ
  ثلاث سنوات مهندسَ موثوقية أول (Staff SRE) مناوبًا على كامل أسطول نسخ العملاء في ServiceNow، وست سنوات في AWS -
  أولًا خبيرًا متخصصًا في RDS، ثم في البنية التحتية ككود وأتمتة بناء المناطق (Regions)، بما في ذلك المشروع الذي
  خفّض زمن ترقيع الأسطول من أكثر من 40 يومًا إلى 7 أيام. أعمل بمنهجية الذكاء الاصطناعي أولًا، فأبني أدوات للوكلاء
  وأنظمة متعددة الوكلاء تضاعف إنتاجية الفرق الهندسية.


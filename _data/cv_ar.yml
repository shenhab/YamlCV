      (123 نوع إحصاء للاعبين و32 للفرق، وأحداث مباريات موسومة بالدقيقة) يحوي أكثر من 10 ملايين صف إحصائي عبر نحو
      9,600 مباراة، تغذّيه طبقة استيعاب قابلة للتوصيل بخمسة محوّلات مصادر، وتخزين مؤقت بتجزئة المحتوى، وتوفيق
      للكيانات عبر المصادر. فرضتُ الحد الأدنى من الصلاحيات على مستوى قاعدة البيانات بأدوار Postgres منفصلة، بحيث لا
      تستطيع الخدمة العامة قراءة حالة الإدارة أو الأسرار. بنيتُ إطار تحقق كشف عيبًا في ربط الأعمدة وصحّح 5,307
      سجلات. يُنشر عبر Docker Compose مع ترحيلات Alembic تلقائية ونشر بأمر واحد مع فحوصات صحة، مستضاف ذاتيًا على
      Proxmox. طُوّر بمنهجية الذكاء الاصطناعي أولًا باستخدام Claude Code مع سجل دائم للبنية والقرارات.

  - title: Automated Azan - إعلان مواقيت الصلاة عبر Chromecast (github.com/shenhab/Automated-Azan)
    description: >
      خدمة Python مفتوحة المصدر تجدول الأذان وتبثه إلى أجهزة Chromecast وGoogle Home، مع واجهة ويب للإدارة.
      مُعبّأة كصورة Docker متعددة المراحل (مستخدم غير جذري، فحص صحة) منشورة على Docker Hub، مع خط إصدار على
      GitHub Actions يبني ويدفع وسمَي الإصدار وlatest مع كل إصدار، ونشر عبر Docker Compose.

  - title: YamlCV
    description: >
      هذه السيرة الذاتية. نظام «سيرة ذاتية ككود» مبني على Jekyll يستخدم YAML مصدرًا وحيدًا للحقيقة ويولّد منه سيرة
      ذاتية تفاعلية بصيغة HTML ونسخة متوافقة مع أنظمة تتبع المتقدمين (ATS)، بالإنجليزية والعربية.
      https://github.com/shenhab/YamlCV

  - title: مختبر منزلي - بنية تحتية ذاتية الاستضافة
    description: >
      أشغّل بيئة ذاتية الاستضافة على عنقود Proxmox VE من عقدتين يتيح إدارة أحمال العمل وترحيلها بين العقدتين، مع
      خادم TrueNAS يوفر تخزينًا مشتركًا ونسخًا احتياطيًا مستمرًا لبياناته خارج الموقع إلى التخزين السحابي. يستضيف
      خدماتي الخاصة، ومنها Football Wizards ونسخة n8n لأتمتة سير العمل.

experience:
  - company: Okta
    position: مهندس أول لأتمتة الامتثال (Staff Compliance Automation Engineer)
    location: دبلن، أيرلندا (عن بُعد)
    start_date: سبتمبر 2024
    end_date: حتى الآن
    achievements:
      - صممتُ وقدتُ Heimdall، منصة Okta المستمرة لجمع أدلة الامتثال، بصفتي القائد التقني والمؤلف الرئيسي - نحو 90% من أكثر من 570 commit، ونحو 33 ألف سطر من كود Python الإنتاجي، وأكثر من 2,100 اختبار آلي.
      - أتمتُ دورة تدقيق SOC 2 كاملة من البداية إلى النهاية - جُمعت 127 تذكرة أدلة وأُرفقت وقُدّمت دون أي عمل يدوي، قبِل المدققون 125 منها (98%) وأُحيلت التذكرتان المتبقيتان إلى مالكي الخدمات للمعالجة، لتحل 8 ساعات من التشغيل الآلي محل نحو 635 ساعة هندسية من الجمع اليدوي (نحو 5 ساعات لكل تذكرة).
      - صممتُ نواة قائمة على الإضافات (التنسيق، إدارة بيانات الاعتماد، سجل تدقيق لكل استدعاء API، تقارير متعددة الصيغ) تُوصَل بها مصادر البيانات الجديدة دون المساس بالمنطق الأساسي، ووسّعتها إلى 23 جامعًا عبر Okta وGitHub وAWS وHTTP تنتج 129 عنصر أدلة مرتبطًا بـ 171 ضابطًا أمنيًا.
      - أغلقتُ الحلقة مع عملية التدقيق - بنيتُ منسقًا قائمًا على Windmill يستلم تذاكر التدقيق في Jira، ويشغّل عملية الجمع المطابقة، ويرفق الأدلة، وينقل حالة التذكرة، مع اكتشاف المهام المتوقفة، وتنبيهات Slack مع إعادة محاولة بنقرة واحدة، وجداول شهرية متدرجة لكل عنصر.
      - بنيتُ خط تسليم أدلة متحقَّقًا من سلامته - 5 دوال AWS Lambda تنسقها Step Functions ومعرّفة في CloudFormation، مع التحقق من المجاميع الاختبارية (checksums) في كل مرحلة من S3 إلى Google Drive.
      - تولّيتُ بنية CI/CD والإصدارات - يبني GitHub Actions حزمة واحدة مثبّتة الإصدار، تُتحقق عند ثلاث نقاط مستقلة، وتُنشر تلقائيًا في بيئة التطوير وتُرقّى أسبوعيًا إلى الإنتاج عبر AWS CodeDeploy (65 إصدارًا موسومًا)، مع تجهيز المضيفين دون تدخل يدوي وبيانات اعتماد ذاتية التهيئة.
      - سلّمتُ منصتي Heimdall وWindmill كبنية تحتية ككود - موارد AWS معرّفة في CloudFormation، وWindmill منشور كحاويات Docker، وكل شيء يُطرح على المضيفين عبر AWS CodeDeploy ويُدار من طرف إلى طرف بواسطة GitHub Actions، بحيث تُبنى البيئتان من المستودع لا يدويًا.
      - نفّذتُ عملاء API آمنين بالتصميم (OAuth2 بـ private-key JWT مع DPoP، ومصادقة GitHub App، وترقيم صفحات واعٍ بحدود المعدل) وأغلقتُ ثغرات أمنية وتشغيلية - عالجتُ نتائج Dependabot، وحصّنتُ مسارات التسلسل (serialization)، وأعدتُ تصميم التقارير لتُكتب تدفقيًا إلى القرص، ما أنهى أعطال نفاد الذاكرة في عمليات الجمع الكبيرة.
      - بنيتُ ActionHub، منصة سير عمل للامتثال (Flask / PostgreSQL) حلّت محل استبيانات الامتثال اليدوية - نماذج ديناميكية، ودورة حياة للتكليفات، وصلاحيات RBAC للمراجعين، ومحرك سير عمل في الخلفية، وتسجيل تدقيق كامل، وتسجيل دخول موحّد عبر Okta، مدعومة بـ 980 اختبارًا.
      - قدتُ تبنّي الذكاء الاصطناعي في الفريق - كتبتُ مهارات Claude Code تجعل تتبّع الأدلة وفرز التذاكر حتميًا، وبنيتُ خوادم MCP محلية (مولّدة بـ Claude Code) لواجهات API داخلية مثل Jira ليتمكن الوكلاء من تشغيل تلك الخدمات مباشرة، وقدّمتُ جلسات عن الهندسة بمساعدة الذكاء الاصطناعي، وصممتُ نظامًا متعدد الوكلاء يولّد جامعات جديدة من طلبات Jira لتوسيع التغطية عبر ما تبقى من نطاق التدقيق.
      - وجّهتُ المهندسين في تصميم برمجيات آمنة وقابلة للاختبار، ووثّقتُ بنية المنصة وتدفقات بياناتها في المستودع بمخططات Mermaid، وأوصلتها إلى حالة الاستقرار قبل تسليم ملكيتها طويلة الأمد إلى فريق هندسة الأمن (Security Architecture).


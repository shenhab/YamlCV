name: Site checks

# Builds the site the way GitHub Pages does, then checks the CV data file and the built
# pages. A failed run means the published CV would be broken.
on:
  push:        # every branch, so a bad CV is caught before it is merged
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the site and check data file, page structure and links
        run: |
          pip install pyyaml
          python tools/check_site.py

name: Site checks

# Builds the site the way GitHub Pages does, then checks the CV data file and the built
# pages. A failed run means the published CV would be broken.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build the site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check data file, page structure and links
        run: |
          pip install pyyaml
          python tools/check_site.py

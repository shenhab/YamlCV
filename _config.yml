# Build settings
# No theme: _layouts/cv.html and _layouts/ats.html are complete documents that bring their
# own styling. The four pages (index.html, ats-resume.html and their ar/ counterparts) are
# front-matter stubs that pick a layout, a language and a data file.
markdown: kramdown
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - vendor

# Social media profiles
social:
